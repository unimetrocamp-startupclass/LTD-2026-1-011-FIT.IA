[mcp_servers.serena]
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "codex"]
enabled = true

[mcp_servers.serena.tools.write_memory]
approval_mode = "approve"

[mcp_servers.context7]
command = "C:\\nvm4w\\nodejs\\node.exe"
args = ["C:\\Users\\rafae\\AppData\\Roaming\\npm\\node_modules\\@upstash\\context7-mcp\\dist\\index.js", "--transport", "stdio"]
enabled = true
startup_timeout_sec = 40
env_vars = ["MCP_PASSWORD", "CONTEXT7_API_KEY"]

[mcp_servers.perplexity]
command = "cmd"
args = ["/c", "set", "PERPLEXITY_API_KEY=%MCP_PASSWORD%", "&&", "npx", "-y", "@perplexity-ai/mcp-server"]
enabled = true
startup_timeout_sec = 30
env_vars = ["MCP_PASSWORD"]

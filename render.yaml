services:
  - type: web
    name: fitia-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 3333
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitia-db
          property: connectionString
      - key: POSTGRES_USER
        fromDatabase:
          name: fitia-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: fitia-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: fitia-db
          property: database
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: API_BASE_URL
        sync: false
      - key: WEB_APP_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false

databases:
  - name: fitia-db
    databaseName: fit_ia_db
    user: fitia
    plan: free
